<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaePe · Te invitaron a un grupo</title>
  <meta name="description" content="Te invitaron a una collera en CaePe. Descarga la app y únete para organizar las salidas del grupo." />

  <link rel="icon" type="image/png" href="./logo.png" />
  <meta property="og:title" content="CaePe · Te invitaron a un grupo" />
  <meta property="og:description" content="Únete a la collera y organiza las salidas sin dramas." />
  <meta property="og:image" content="./logo.png" />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
  <link rel="stylesheet" href="./styles.css" />

  <style>
    /* ---- Invite page (scoped) ---- */
    .invite { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 18px; gap: 18px; }
    .invite__brand { display: flex; align-items: center; gap: 10px; }
    .invite__brand img { width: 40px; height: 40px; }
    .invite__brand span { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 1.4rem; color: var(--ink); }
    .invite-card {
      width: 100%; max-width: 460px; background: var(--card);
      border: var(--b) solid var(--on-color); border-radius: var(--r-lg);
      box-shadow: 6px 6px 0 var(--on-color); padding: 22px; display: flex; flex-direction: column; gap: 16px;
    }
    .invite-card__tag { align-self: flex-start; font-weight: 700; font-size: .8rem; padding: 4px 12px; border-radius: var(--r-pill); background: var(--mint); border: 2px solid var(--on-color); color: var(--on-color); }
    .invite-card__title { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 1.7rem; line-height: 1.15; color: var(--ink); margin: 0; }
    .invite-row { display: flex; align-items: center; gap: 10px; color: var(--ink-soft); font-weight: 500; }
    .invite-row i { font-size: 1.2rem; color: var(--coral-2); }
    .invite-code { background: var(--yellow); border: var(--b) solid var(--on-color); border-radius: var(--r); padding: 12px 16px; text-align: center; }
    .invite-code span { display: block; font-size: .82rem; font-weight: 600; color: var(--on-color-soft); }
    .invite-code strong { font-family: "Fredoka", sans-serif; font-size: 1.8rem; letter-spacing: 2px; color: var(--on-color); }
    .invite-note { font-size: .8rem; color: var(--ink-soft); text-align: center; }
    .invite-actions { display: flex; flex-direction: column; gap: 10px; }
    .invite-state { text-align: center; color: var(--ink-soft); padding: 40px 0; }
    .invite-state i { font-size: 2.4rem; display: block; margin-bottom: 10px; color: var(--coral-2); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="invite">
    <a class="invite__brand" href="/" aria-label="CaePe, inicio">
      <img src="./logo.png" alt="" width="40" height="40" />
      <span>CaePe</span>
    </a>

    <!-- Loading -->
    <div class="invite-card" id="stateLoading">
      <div class="invite-state"><i class="ph-bold ph-spinner-gap"></i>Cargando invitación…</div>
    </div>

    <!-- Error -->
    <div class="invite-card hidden" id="stateError">
      <div class="invite-state">
        <i class="ph-bold ph-warning-circle"></i>
        <p>No encontramos este grupo. El código puede ser incorrecto o haber expirado.</p>
      </div>
      <div class="invite-actions">
        <a class="btn btn--primary" href="/#descargar"><i class="ph-bold ph-download-simple"></i> Descargar CaePe</a>
      </div>
    </div>

    <!-- Group -->
    <div class="invite-card hidden" id="stateGroup">
      <span class="invite-card__tag"><i class="ph-bold ph-users-three"></i> ¡Te invitaron a una collera!</span>
      <h1 class="invite-card__title" id="grName"></h1>

      <div class="invite-row" id="grMembersRow"><i class="ph-bold ph-users"></i><span id="grMembers"></span></div>

      <div class="invite-code">
        <span>Tu código para unirte</span>
        <strong id="grCode"></strong>
      </div>

      <p class="invite-note"><i class="ph-bold ph-info"></i> Descarga la app, entra con tu cuenta y mete el código para unirte al grupo.</p>

      <div class="invite-actions">
        <a class="btn btn--primary" href="/#descargar"><i class="ph-bold ph-download-simple"></i> Descargar la app para unirte</a>
      </div>
    </div>
  </main>

  <script>
    // ===== CONFIG: URL del backend (Render) =====
    const API_BASE = "https://caepe.onrender.com";
    // ============================================

    function getInviteCode() {
      const m = location.pathname.match(/\/groups\/join\/([^/?#]+)/i);
      if (m) return decodeURIComponent(m[1]);
      return new URLSearchParams(location.search).get("code");
    }

    function show(id) {
      ["stateLoading", "stateError", "stateGroup"].forEach((s) => {
        document.getElementById(s).classList.toggle("hidden", s !== id);
      });
    }

    async function load() {
      const code = getInviteCode();
      if (!code) { show("stateError"); return; }
      try {
        const res = await fetch(`${API_BASE}/groups/by-invite/${encodeURIComponent(code)}`);
        if (!res.ok) throw new Error("not found");
        const g = await res.json();

        document.getElementById("grName").textContent = g.name || "Grupo en CaePe";
        const n = Number(g.members_count) || 0;
        document.getElementById("grMembers").textContent = n === 1 ? "1 integrante" : `${n} integrantes`;
        document.getElementById("grCode").textContent = code;

        show("stateGroup");
      } catch (_) {
        show("stateError");
      }
    }

    load();
  </script>
</body>
</html>
