<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaePe · Pagar</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
  <link rel="stylesheet" href="/styles.css" />

  <style>
    .pay { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 18px; gap: 18px; }
    .pay__brand { display: flex; align-items: center; gap: 10px; }
    .pay__brand img { width: 40px; height: 40px; }
    .pay__brand span { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 1.4rem; color: var(--ink); }
    .pay-card {
      width: 100%; max-width: 440px; background: var(--card);
      border: var(--b) solid var(--on-color); border-radius: var(--r-lg);
      box-shadow: 6px 6px 0 var(--on-color); padding: 22px; display: flex; flex-direction: column; gap: 14px;
    }
    .pay-card__head { text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .pay-card__tag { font-weight: 700; font-size: .8rem; padding: 4px 12px; border-radius: var(--r-pill); background: var(--mint); border: 2px solid var(--on-color); color: var(--on-color); }
    .pay-card__title { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 1.4rem; color: var(--ink); margin: 0; }
    .pay-amount { background: var(--yellow); border: var(--b) solid var(--on-color); border-radius: var(--r); padding: 12px 16px; text-align: center; }
    .pay-amount span { display: block; font-size: .8rem; font-weight: 600; color: var(--on-color-soft); }
    .pay-amount strong { font-family: "Fredoka", sans-serif; font-size: 1.8rem; color: var(--on-color); }
    .pay-note { font-size: .78rem; color: var(--ink-soft); text-align: center; }
    .pay-state { text-align: center; color: var(--ink-soft); padding: 30px 0; }
    .pay-state i { font-size: 2.2rem; display: block; margin-bottom: 10px; color: var(--coral-2); }
    .pay-actions { display: flex; flex-direction: column; gap: 10px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="pay">
    <a class="pay__brand" href="/" aria-label="CaePe, inicio">
      <img src="/logo.png" alt="" width="40" height="40" />
      <span>CaePe</span>
    </a>

    <div class="pay-card" id="stateLoading">
      <div class="pay-state"><i class="ph-bold ph-spinner-gap"></i>Cargando tu compra…</div>
    </div>

    <div class="pay-card hidden" id="stateError">
      <div class="pay-state"><i class="ph-bold ph-warning-circle"></i><p id="errorMsg">No pudimos cargar este pago.</p></div>
      <div class="pay-actions"><a class="btn btn--ghost" href="caepe://paywall">Volver a la app</a></div>
    </div>

    <div class="pay-card hidden" id="statePay">
      <div class="pay-card__head">
        <span class="pay-card__tag"><i class="ph-bold ph-shopping-bag"></i> <span id="payKind">Tu compra</span></span>
        <h1 class="pay-card__title" id="payTitle"></h1>
      </div>
      <div class="pay-amount">
        <span>Total a pagar</span>
        <strong id="payAmount"></strong>
      </div>
      <div id="cardPaymentBrick_container"></div>
      <p id="payError" class="pay-note" style="color: var(--coral-2); font-weight: 600;"></p>
      <p class="pay-note"><i class="ph-bold ph-shield-check"></i> Pago seguro procesado por Mercado Pago.</p>
    </div>

    <div class="pay-card hidden" id="stateProcessing">
      <div class="pay-state"><i class="ph-bold ph-spinner-gap"></i>Procesando tu pago…</div>
    </div>
  </main>

  <script src="https://sdk.mercadopago.com/js/v2"></script>
  <script>
    // ===== CONFIG: URL del backend (Render) =====
    const API_BASE = "https://caepe.onrender.com";
    const RETURN_BASE = "https://caepe.lat/billing/return";
    // ============================================

    let PAYMENT = null;

    function show(id) {
      ["stateLoading", "stateError", "statePay", "stateProcessing"].forEach((s) => {
        document.getElementById(s).classList.toggle("hidden", s !== id);
      });
    }
    function fail(msg) {
      if (msg) document.getElementById("errorMsg").textContent = msg;
      show("stateError");
    }
    function getBp() {
      return new URLSearchParams(location.search).get("bp");
    }

    function showError(msg) {
      const el = document.getElementById("payError");
      if (el) el.textContent = msg || "";
    }

    // NO ocultamos el Brick mientras procesamos (ocultarlo lo rompe). Mostramos el
    // error real en pantalla para diagnosticar, en vez del mensaje genérico.
    async function chargeBackend(formData) {
      showError("");
      const fd = formData && formData.formData ? formData.formData : formData; // soporta ambas firmas
      const body = {
        billing_payment_id: PAYMENT.id,
        token: fd.token,
        payment_method_id: fd.payment_method_id,
        issuer_id: fd.issuer_id,
        installments: fd.installments || 1,
        payer_email: fd.payer && fd.payer.email,
        identification: fd.payer && fd.payer.identification,
      };
      try {
        const res = await fetch(`${API_BASE}/billing/charge`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (res.ok) {
          location.href = `${RETURN_BASE}?status=approved`;
          return;
        }
        let msg = `Error ${res.status}.`;
        try { const b = await res.json(); if (b.detail) msg = typeof b.detail === "string" ? b.detail : JSON.stringify(b.detail); } catch (_) {}
        showError(msg);
        if (!fd.token) showError("No se generó el token de la tarjeta (token vacío). " + msg);
      } catch (e) {
        showError("No se pudo conectar con el servidor: " + (e && e.message ? e.message : e));
      }
    }

    function mountBrick() {
      const mp = new MercadoPago(PAYMENT.public_key, { locale: "es-PE" });
      const bricks = mp.bricks();
      bricks.create("cardPayment", "cardPaymentBrick_container", {
        initialization: { amount: Number(PAYMENT.amount) },
        customization: { paymentMethods: { maxInstallments: 1 } },
        callbacks: {
          onReady: () => {},
          onSubmit: (cardFormData) => {
            // cardFormData: { token, payment_method_id, issuer_id, installments, payer }
            return chargeBackend(cardFormData);
          },
          onError: (error) => {
            console.error("Brick error", error);
            let msg = "Error del formulario de pago.";
            try { msg = (error && (error.message || error.cause)) ? JSON.stringify(error.message || error.cause) : JSON.stringify(error); } catch (_) {}
            showError("MP: " + msg);
          },
        },
      });
    }

    async function load() {
      const bp = getBp();
      if (!bp) return fail("Falta el identificador del pago.");
      try {
        const res = await fetch(`${API_BASE}/billing/payment/${encodeURIComponent(bp)}/public`);
        if (!res.ok) throw new Error("not found");
        PAYMENT = await res.json();

        if (PAYMENT.status === "approved") {
          location.href = `${RETURN_BASE}?status=approved`;
          return;
        }

        document.getElementById("payTitle").textContent = PAYMENT.title;
        document.getElementById("payKind").textContent = PAYMENT.kind === "premium" ? "Premium" : "Créditos";
        document.getElementById("payAmount").textContent = `S/ ${Number(PAYMENT.amount).toFixed(2)}`;

        show("statePay");
        mountBrick();
      } catch (_) {
        fail("No encontramos esta compra o ya expiró.");
      }
    }

    load();
  </script>
</body>
</html>
